[project]
name = "fungal-cortex"
version = "2.0.0"
description = "Fungal Cortex v2.0 — L6-Complete Agent Framework for QuantMind OS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "networkx>=3.2",
    "chromadb>=0.4",
    "fastapi>=0.109",
    "websockets>=12.0",
    "docker>=7.0",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--cov=src", "--cov-report=term-missing"]
