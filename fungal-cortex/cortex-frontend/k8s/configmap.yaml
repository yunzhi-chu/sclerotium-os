apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: cortex-prod
  labels:
    app: cortex
    environment: production
data:
  BACKEND_HOST: "cortex-backend"
  BACKEND_PORT: "8000"
  CHROMA_HOST: "cortex-chromadb"
  CHROMA_PORT: "8001"
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://cortex.quantmind.io/api"
  NEXT_PUBLIC_WS_URL: "wss://cortex.quantmind.io/ws"
